# Free Docker web service. Render injects PORT; the image listens on 0.0.0.0:$PORT.
# Plan `free` is 0.1 CPU and 512 MB RAM. ORT_THREADS=1 matches that CPU and
# keeps the measured clip-job RSS near 250 MB. See the README for the measurement.
services:
  - type: web
    name: yolov8-detection-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Auto-deploy on each commit to the linked branch.
    autoDeployTrigger: commit
    envVars:
      - key: ORT_THREADS
        value: "1"
      - key: WORKERS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "1"
      - key: MAX_RETAINED_JOBS
        value: "2"
