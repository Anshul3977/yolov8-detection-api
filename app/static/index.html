<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YOLOv8 Detection API</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --fg:#e8eaed; --muted:#9aa0a6; --accent:#4f9cf9; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  label.btn, button { background:#1a1f26; border:1px solid #2a313b; color:var(--fg); padding:8px 14px; border-radius:8px; cursor:pointer; }
  input[type=file] { display:none; }
  canvas { max-width:100%; border-radius:8px; border:1px solid #2a313b; display:block; }
  pre { background:#12161b; border:1px solid #2a313b; border-radius:8px; padding:12px; overflow:auto; max-height:320px; font-size:13px; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>YOLOv8 Detection API</h1>
  <p>Pretrained YOLOv8n (COCO, 80 classes) on ONNX Runtime, CPU only. Try an image here, or use
    <a href="/docs">/docs</a>, <a href="/health">/health</a>, <a href="/metrics">/metrics</a>.</p>
  <div class="row">
    <label class="btn">Choose image<input id="file" type="file" accept="image/*" /></label>
    <label>conf <input id="conf" type="number" min="0" max="1" step="0.05" value="0.25" style="width:70px" /></label>
    <span id="status"></span>
  </div>
  <canvas id="canvas" width="0" height="0"></canvas>
  <pre id="json"></pre>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("status").textContent = "Detecting…";
  const body = new FormData();
  body.append("file", file);
  const t0 = performance.now();
  const res = await fetch(`/detect?conf=${$("conf").value}`, { method: "POST", body });
  const data = await res.json();
  const rtt = Math.round(performance.now() - t0);
  $("json").textContent = JSON.stringify(data, null, 2);
  if (!res.ok) { $("status").textContent = `Error ${res.status}`; return; }
  $("status").textContent = `${data.count} objects · model ${data.timings.inference_ms} ms · round trip ${rtt} ms`;
  const img = await createImageBitmap(file, { imageOrientation: "from-image" });
  const c = $("canvas"), ctx = c.getContext("2d");
  c.width = img.width; c.height = img.height;
  ctx.drawImage(img, 0, 0);
  const lw = Math.max(2, img.width / 400);
  ctx.lineWidth = lw; ctx.font = `${lw * 7}px system-ui`;
  for (const d of data.detections) {
    const { x1, y1, x2, y2 } = d.box;
    const hue = (d.class_id * 47) % 360;
    ctx.strokeStyle = ctx.fillStyle = `hsl(${hue} 90% 55%)`;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const text = `${d.label} ${(d.confidence * 100).toFixed(0)}%`;
    const tw = ctx.measureText(text).width + lw * 2;
    ctx.fillRect(x1, Math.max(0, y1 - lw * 9), tw, lw * 9);
    ctx.fillStyle = "#000"; ctx.fillText(text, x1 + lw, Math.max(lw * 7, y1 - lw * 2));
  }
});
</script>
</body>
</html>
