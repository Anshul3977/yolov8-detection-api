# Optional and inactive unless both HF_TOKEN and HF_SPACE are set.
# Hugging Face Docker Spaces on free CPU returned 402 (PRO required), so
# the live service is the Render Blueprint in render.yaml, not this workflow.
name: Sync Hugging Face Space (optional)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync main to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "${HF_TOKEN}" ] || [ -z "${HF_SPACE}" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable is unset. Skipping Space sync."
            exit 0
          fi
          pip install huggingface_hub
          python scripts/sync_space.py
