name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t yolov8-detection-api .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 7860:7860 yolov8-detection-api
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 1; done
          curl -sf localhost:7860/health
          curl -sf -F "file=@tests/assets/bus.jpg" localhost:7860/detect | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['count'], 'objects'); assert any(d['label']=='bus' for d in r['detections'])"
          curl -sf localhost:7860/metrics | grep -q model_inference_duration_seconds
      - if: failure()
        run: docker logs api
